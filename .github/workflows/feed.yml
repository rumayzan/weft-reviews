name: Google reviews feed

# Every day: rebuild the product reviews feed from weftrug.com and publish it on GitHub Pages,
# where Google Merchant Center fetches it.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC = 06:17 in Riyadh
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if more than 5 published reviews are missing (they were really deleted)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the feed
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node build-feed.mjs --out site/google-product-reviews.xml --previous "https://rumayzan.github.io/weft-reviews/google-product-reviews.xml"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      # a commit on every run keeps the repository active, so GitHub never turns the daily schedule off
      - name: Record the run
        run: |
          cp site/status.json status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Feed built $(date -u +%F)" || exit 0
          git push
